<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
            background-color:#80b500 ; /* light green background */
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        form {
            background-color: #ffffff; /* very light green */
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 128, 0, 0.2);
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #80b500; /* dark green */
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #a3d9a5;
            border-radius: 5px;
            box-sizing: border-box;
        }

        select.nice-select {
            background-color: #f9fff9;
        }

        button {
            background-color: #006400; /* dark green */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #228B22; /* forest green */
        }
    </style>

</head>
<body>
<form th:action="@{/admin/update-product}" th:object="${product}" method="post">
    <input type="hidden" th:field="*{productId}" />

    <label>Name:</label>
    <input type="text" th:field="*{name}" /><br/>

    <label>Description:</label>
    <textarea th:field="*{description}"></textarea><br/>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" /><br/>

    <label>Old Price:</label>
    <input type="number" step="0.01" th:field="*{oldPrice}" /><br/>

    <label>Stock:</label>
    <input type="number" th:field="*{stock}" /><br/>

    <label>Category:</label>
    <select th:field="*{category}" class="nice-select" required>
        <option value="">Select Product Category</option>
        <option value="Food and Drinks">Food and Drinks</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Dried Foods">Dried Foods</option>
        <option value="Bread and Cake">Bread and Cake</option>
        <option value="Fish and Meat">Fish and Meat</option>
    </select><br/>

    <label>Badge:</label>
    <input type="text" th:field="*{badge}" /><br/>

    <button type="submit">Update Product</button>
</form>
</body>
</html>
